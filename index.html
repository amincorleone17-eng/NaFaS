<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>نَفَس | مدیریت مصرف سیگار</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --border:#2a2f3a;
  --red:#e5484d; --red-dim:#3a1f22; --green:#3ecf8e; --green-dim:#173229;
  --text:#eef0f3; --sub:#8b909c; --accent:#5b8cff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box} html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--text);height:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:14px 14px calc(80px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0 0 8px} h1{font-size:18px} h2{font-size:16px} h3{font-size:14px;color:var(--sub);font-weight:normal}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;color:var(--text);background:var(--card2);width:100%}
.btn-red{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#06241a}.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border-radius:12px;padding:10px 12px}.stat .v{font-size:18px;font-weight:bold}.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.day-row:last-child{border-bottom:none}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;margin-inline-start:6px}.pill-red{background:var(--red-dim);color:var(--red)}.pill-green{background:var(--green-dim);color:var(--green)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:none;color:var(--sub);padding:12px 4px;font-size:12px;cursor:pointer}.tabbar button.active{color:var(--accent);font-weight:bold}
input,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:14px;margin-top:4px}
label{font-size:13px;color:var(--sub);display:block;margin-top:10px}.muted{color:var(--sub);font-size:13px}.center{text-align:center}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card2);font-size:13px;cursor:pointer}.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.link{color:var(--accent);background:none;border:none;font-size:13px;cursor:pointer}hr{border:none;border-top:1px solid var(--border);margin:12px 0}
</style></head><body>
<div id="app"></div><div class="tabbar" id="tabbar"></div>
<script>
const KEYS={events:'cig_events',periods:'cig_periods',settings:'cig_settings'};
function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
let events=load(KEYS.events,[]),periods=load(KEYS.periods,[]),settings=load(KEYS.settings,{price:3000});
function persistAll(){save(KEYS.events,events);save(KEYS.periods,periods);save(KEYS.settings,settings)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)} const DAY=86400000;
let view='home',detailId=null,compareSel=[],newPeriodType='tracking',newPeriodDays=21;
function activePeriod(){return periods.find(p=>p.status==='active')||null} function getPeriod(id){return periods.find(p=>p.id===id)}
function createPeriod(name,type,targetDays){if(activePeriod())return;const now=Date.now();periods.push({id:uid(),name:name||(type==='tracking'?'دوره پیگیری':'هدف بدون سیگار'),type,targetDays:targetDays||null,startedAt:now,scheduledEndAt:targetDays?now+targetDays*DAY:null,endedAt:null,status:'active',createdAt:now});persistAll();view='home';render()}
function endPeriod(id,manual){const p=getPeriod(id);if(!p)return;p.endedAt=Date.now();p.status=manual?'manuallyEnded':'completed';persistAll()}
function checkAutoComplete(){const p=activePeriod();if(p&&p.scheduledEndAt&&Date.now()>=p.scheduledEndAt)endPeriod(p.id,false)}
function addEvent(type){events.push({id:uid(),type,ts:Date.now(),price:settings.price});persistAll();render()}
function eventsInRange(start,end){const e=end||Date.now();return events.filter(ev=>ev.ts>=start&&ev.ts<=e)}
function dayIndex(ts,start){return Math.floor((ts-start)/DAY)}
function computeStats(period){const end=period.endedAt||Date.now(),evs=eventsInRange(period.startedAt,end),smoked=evs.filter(e=>e.type==='smoked'),resist=evs.filter(e=>e.type==='resist'),cost=smoked.reduce((s,e)=>s+(e.price||0),0),savings=resist.length*settings.price,daysElapsed=Math.min(Math.floor((end-period.startedAt)/DAY)+1,period.targetDays||Infinity),avgPerDay=daysElapsed>0?smoked.length/daysElapsed:0,dayMap={};
smoked.forEach(e=>{const d=dayIndex(e.ts,period.startedAt);dayMap[d]=dayMap[d]||{s:0,r:0};dayMap[d].s++});resist.forEach(e=>{const d=dayIndex(e.ts,period.startedAt);dayMap[d]=dayMap[d]||{s:0,r:0};dayMap[d].r++});
const totalDaySpan=Math.max(1,Math.floor((end-period.startedAt)/DAY)+1);let daysWithout=0,daysWith=0;for(let d=0;d<totalDaySpan;d++){if(dayMap[d]&&dayMap[d].s>0)daysWith++;else daysWithout++}
const sortedSmoked=smoked.slice().sort((a,b)=>a.ts-b.ts);let longest=0,prev=period.startedAt;sortedSmoked.forEach(e=>{longest=Math.max(longest,e.ts-prev);prev=e.ts});longest=Math.max(longest,end-prev);
return{smokedCount:smoked.length,resistCount:resist.length,cost,savings,avgPerDay,daysElapsed,daysWithout,daysWith,totalDaySpan,longestMs:longest,first:sortedSmoked[0]||null,last:sortedSmoked[sortedSmoked.length-1]||null,dayMap,smoked,resist}}
function fmtMoney(n){return Math.round(n).toLocaleString('fa-IR')+' تومان'} function fmtDur(ms){if(!ms||ms<=0)return'۰ ساعت';const totalH=Math.floor(ms/3600000),d=Math.floor(totalH/24),h=totalH%24;return((d>0?toFa(d)+' روز ':'')+toFa(h)+' ساعت').trim()} function toFa(n){return n.toString().toLocaleString('fa-IR')} function fmtDate(ts){return new Date(ts).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
function render(){checkAutoComplete();const app=document.getElementById('app');app.innerHTML='';if(view==='home')app.appendChild(renderHome());else if(view==='new')app.appendChild(renderNew());else if(view==='detail')app.appendChild(renderDetail(detailId));else if(view==='history')app.appendChild(renderHistory());else if(view==='compare')app.appendChild(renderCompare());else if(view==='settings')app.appendChild(renderSettings());renderTabbar()}
function renderTabbar(){const tb=document.getElementById('tabbar'),tabs=[['home','خانه'],['history','تاریخچه'],['settings','تنظیمات']];tb.innerHTML=tabs.map(([id,label])=>`<button data-v="${id}" class="${view===id||(view==='detail'&&id==='home')||(view==='compare'&&id==='history')||(view==='new'&&id==='home')?'active':''}">${label}</button>`).join('');tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function renderHome(){const wrap=document.createElement('div'),p=activePeriod();if(!p){wrap.innerHTML=`<h1>نَفَس</h1><div class="card center"><div class="muted" style="margin-bottom:10px">در حال حاضر دوره‌ی فعالی نداری</div><button class="btn" id="startBtn">شروع دوره جدید</button></div><div class="card"><h3>ثبت سریع (بدون دوره)</h3><div class="row" style="margin-top:8px"><button class="btn btn-red" id="smokeBtn">🔴 کشیدم</button><button class="btn btn-green" id="resistBtn">🟢 مقاومت کردم</button></div></div>`;wrap.querySelector('#startBtn').onclick=()=>{view='new';render()};wrap.querySelector('#smokeBtn').onclick=()=>addEvent('smoked');wrap.querySelector('#resistBtn').onclick=()=>addEvent('resist');return wrap}
const st=computeStats(p),dayLabel=p.targetDays?`روز ${toFa(Math.min(st.daysElapsed,p.targetDays))} از ${toFa(p.targetDays)}`:`روز ${toFa(st.daysElapsed)} (بدون محدودیت)`;
wrap.innerHTML=`<h1>نَفَس</h1><div class="card"><div class="top-actions"><h2>${p.name}</h2><span class="muted">${p.type==='tracking'?'دوره پیگیری':'هدف بدون سیگار'}</span></div><div class="muted">${dayLabel}</div><div class="row" style="margin-top:14px"><button class="btn btn-red" id="smokeBtn">🔴 کشیدم</button><button class="btn btn-green" id="resistBtn">🟢 مقاومت کردم</button></div><hr><div class="stat-grid"><div class="stat"><div class="v">${toFa(st.smokedCount)}</div><div class="l">نخ کشیده‌شده</div></div><div class="stat"><div class="v">${toFa(st.resistCount)}</div><div class="l">دفعات مقاومت</div></div><div class="stat"><div class="v">${fmtMoney(st.cost)}</div><div class="l">هزینه سیگار</div></div><div class="stat"><div class="v">${fmtMoney(st.savings)}</div><div class="l">سود ثبت‌شده</div></div><div class="stat"><div class="v">${st.avgPerDay.toFixed(1).toLocaleString('fa-IR')}</div><div class="l">میانگین در روز</div></div><div class="stat"><div class="v">${toFa(st.daysWithout)}</div><div class="l">روز بدون سیگار</div></div></div><button class="link" id="detailBtn" style="margin-top:10px">مشاهده جزئیات کامل ←</button><button class="link" id="endBtn" style="color:var(--red)">پایان دستی دوره</button></div>`;
wrap.querySelector('#smokeBtn').onclick=()=>addEvent('smoked');wrap.querySelector('#resistBtn').onclick=()=>addEvent('resist');wrap.querySelector('#detailBtn').onclick=()=>{detailId=p.id;view='detail';render()};wrap.querySelector('#endBtn').onclick=()=>{if(confirm('دوره به‌صورت دستی پایان یابد؟ اطلاعات حفظ می‌شود.')){endPeriod(p.id,true);render()}};return wrap}
function renderNew(){const wrap=document.createElement('div');wrap.innerHTML=`<h1>دوره جدید</h1><div class="card"><label>نام دوره (اختیاری)</label><input id="nameInput" placeholder="مثلاً دوره مهر"><label>نوع دوره</label><div class="chip-group"><div class="chip ${newPeriodType==='tracking'?'sel':''}" data-t="tracking">دوره پیگیری</div><div class="chip ${newPeriodType==='smokeFreeGoal'?'sel':''}" data-t="smokeFreeGoal">هدف بدون سیگار</div></div><p class="muted" style="margin-top:8px">در هر دو نوع، اگر سیگار بکشی دوره حذف یا ریست نمی‌شود؛ فقط در آمار ثبت می‌شود.</p><label>مدت زمان</label><div class="chip-group" id="durChips">${[7,21,30].map(d=>`<div class="chip ${newPeriodDays===d?'sel':''}" data-d="${d}">${toFa(d)} روز</div>`).join('')}<div class="chip ${newPeriodDays==='custom'?'sel':''}" data-d="custom">دلخواه</div><div class="chip ${newPeriodDays===null?'sel':''}" data-d="open">نامحدود</div></div><div id="customWrap" style="display:${newPeriodDays==='custom'?'block':'none'}"><input id="customDays" type="number" min="1" placeholder="تعداد روز" style="margin-top:8px"></div><button class="btn" id="createBtn" style="margin-top:16px">ایجاد دوره</button><button class="btn btn-outline" id="cancelBtn" style="margin-top:8px">انصراف</button></div>`;
wrap.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{newPeriodType=c.dataset.t;render()});wrap.querySelectorAll('#durChips .chip').forEach(c=>c.onclick=()=>{newPeriodDays=c.dataset.d==='open'?null:(c.dataset.d==='custom'?'custom':parseInt(c.dataset.d));render()});wrap.querySelector('#createBtn').onclick=()=>{let days=newPeriodDays;if(days==='custom'){const v=parseInt(wrap.querySelector('#customDays').value);if(!v||v<1){alert('تعداد روز معتبر وارد کن');return}days=v}createPeriod(wrap.querySelector('#nameInput').value.trim(),newPeriodType,days)};wrap.querySelector('#cancelBtn').onclick=()=>{view='home';render()};return wrap}
function renderDetail(id){const p=getPeriod(id),wrap=document.createElement('div');if(!p){wrap.innerHTML=`<p class="muted">دوره یافت نشد.</p>`;return wrap}const st=computeStats(p),timelineRows=[],span=p.status==='active'?Math.floor((Date.now()-p.startedAt)/DAY)+1:st.totalDaySpan;for(let d=0;d<span;d++){const info=st.dayMap[d]||{s:0,r:0};timelineRows.push(`<div class="day-row"><span>روز ${toFa(d+1)}</span><span><span class="pill pill-red">🔴 ${toFa(info.s)}</span><span class="pill pill-green">🟢 ${toFa(info.r)}</span></span></div>`)}
wrap.innerHTML=`<button class="link" id="back">→ بازگشت</button><h1>${p.name}</h1><div class="muted">${p.type==='tracking'?'دوره پیگیری':'هدف بدون سیگار'} · وضعیت: ${p.status==='active'?'فعال':p.status==='completed'?'تکمیل‌شده':'پایان دستی'}</div><div class="card"><h3>آمار کلی</h3><div class="stat-grid"><div class="stat"><div class="v">${toFa(st.smokedCount)}</div><div class="l">تعداد سیگار</div></div><div class="stat"><div class="v">${toFa(st.resistCount)}</div><div class="l">دفعات مقاومت</div></div><div class="stat"><div class="v">${fmtMoney(st.cost)}</div><div class="l">هزینه سیگار</div></div><div class="stat"><div class="v">${fmtMoney(st.savings)}</div><div class="l">سود ثبت‌شده</div></div><div class="stat"><div class="v">${st.avgPerDay.toFixed(2).toLocaleString('fa-IR')}</div><div class="l">میانگین در روز</div></div><div class="stat"><div class="v">${toFa(st.daysElapsed)}</div><div class="l">روز سپری‌شده</div></div><div class="stat"><div class="v">${toFa(st.daysWithout)}</div><div class="l">روز بدون سیگار</div></div><div class="stat"><div class="v">${toFa(st.daysWith)}</div><div class="l">روز با حداقل ۱ سیگار</div></div></div><hr><div class="muted">بیشترین فاصله بدون سیگار: <b style="color:var(--text)">${fmtDur(st.longestMs)}</b></div><div class="muted">اولین سیگار در دوره: ${st.first?fmtDate(st.first.ts):'—'}</div><div class="muted">آخرین سیگار در دوره: ${st.last?fmtDate(st.last.ts):'—'}</div></div><div class="card"><h3>جدول روزانه</h3>${timelineRows.join('')||'<div class="muted">هنوز رویدادی ثبت نشده.</div>'}</div>${p.status==='active'?`<button class="btn btn-outline" id="endBtn" style="color:var(--red)">پایان دستی دوره</button>`:''}`;
wrap.querySelector('#back').onclick=()=>{view='home';render()};const endBtn=wrap.querySelector('#endBtn');if(endBtn)endBtn.onclick=()=>{if(confirm('دوره به‌صورت دستی پایان یابد؟')){endPeriod(p.id,true);view='home';render()}};return wrap}
function renderHistory(){const wrap=document.createElement('div'),done=periods.filter(p=>p.status!=='active').sort((a,b)=>b.startedAt-a.startedAt);wrap.innerHTML=`<h1>تاریخچه دوره‌ها</h1>`;if(done.length===0){wrap.innerHTML+=`<div class="card muted center">هنوز دوره تکمیل‌شده‌ای وجود ندارد.</div>`;return wrap}if(compareSel.length===2)wrap.innerHTML+=`<button class="btn" id="goCompare">مقایسه ${toFa(2)} دوره انتخاب‌شده</button>`;const list=document.createElement('div');done.forEach(p=>{const st=computeStats(p),card=el(`<div class="card"><div class="top-actions"><h2>${p.name}</h2><label style="display:flex;align-items:center;gap:4px;font-size:12px"><input type="checkbox" ${compareSel.includes(p.id)?'checked':''} data-cmp="${p.id}"> مقایسه</label></div><div class="muted">${p.targetDays?toFa(p.targetDays)+' روز':'نامحدود'} · ${toFa(st.smokedCount)} سیگار · میانگین ${st.avgPerDay.toFixed(1).toLocaleString('fa-IR')} در روز</div><button class="link" data-open="${p.id}">مشاهده جزئیات ←</button></div>`);card.querySelector('[data-open]').onclick=()=>{detailId=p.id;view='detail';render()};card.querySelector('[data-cmp]').onchange=e=>{const id=p.id;if(e.target.checked){if(compareSel.length>=2)compareSel.shift();compareSel.push(id)}else compareSel=compareSel.filter(x=>x!==id);render()};list.appendChild(card)});wrap.appendChild(list);const goCmp=wrap.querySelector('#goCompare');if(goCmp)goCmp.onclick=()=>{view='compare';render()};return wrap}
function renderCompare(){const wrap=document.createElement('div');wrap.innerHTML=`<button class="link" id="back">→ بازگشت به تاریخچه</button><h1>مقایسه دوره‌ها</h1>`;const[a,b]=compareSel.map(getPeriod);if(!a||!b){wrap.innerHTML+=`<div class="card muted">دو دوره از تاریخچه انتخاب کن.</div>`;wrap.querySelector('#back').onclick=()=>{view='history';render()};return wrap}const sa=computeStats(a),sb=computeStats(b),rows=[['مدت',a.targetDays?toFa(a.targetDays)+' روز':'نامحدود',b.targetDays?toFa(b.targetDays)+' روز':'نامحدود'],['تعداد سیگار',toFa(sa.smokedCount),toFa(sb.smokedCount)],['میانگین در روز',sa.avgPerDay.toFixed(2).toLocaleString('fa-IR'),sb.avgPerDay.toFixed(2).toLocaleString('fa-IR')],['دفعات مقاومت',toFa(sa.resistCount),toFa(sb.resistCount)],['هزینه',fmtMoney(sa.cost),fmtMoney(sb.cost)],['روز بدون سیگار',toFa(sa.daysWithout),toFa(sb.daysWithout)],['بیشترین فاصله',fmtDur(sa.longestMs),fmtDur(sb.longestMs)]];wrap.innerHTML+=`<div class="card"><div class="row"><h3>${a.name}</h3><h3>${b.name}</h3></div>${rows.map(r=>`<div class="day-row"><span>${r[1]}</span><span class="muted">${r[0]}</span><span>${r[2]}</span></div>`).join('')}</div>`;wrap.querySelector('#back').onclick=()=>{view='history';render()};return wrap}
function renderSettings(){const wrap=document.createElement('div');wrap.innerHTML=`<h1>تنظیمات نَفَس</h1><div class="card"><label>قیمت هر نخ سیگار (تومان)</label><input id="priceInput" type="number" value="${settings.price}"><button class="btn" id="saveBtn" style="margin-top:12px">ذخیره</button></div><div class="card center"><h2 style="margin-bottom:12px">نَفَس چیست؟</h2><p class="muted" style="line-height:2;margin:0">«نَفَس» برای این ساخته شده که مصرف سیگارت را آگاهانه‌تر دنبال کنی و لحظه‌هایی را که در برابر میل به سیگار مقاومت می‌کنی ثبت کنی.<br><br>هر وقت خواستی سیگار روشن کنی اما تصمیم گرفتی نکشی، چند لحظه مکث کن، یک نفس عمیق بکش و بعد دکمه «مقاومت کردم» را ثبت کن. گاهی همین چند ثانیه فاصله می‌تواند شروع یک انتخاب متفاوت باشد.</p><hr><div style="font-size:12px;color:var(--sub)">ساخته‌شده توسط <b style="color:var(--text);letter-spacing:1px">TH1</b></div></div>`;
wrap.querySelector('#saveBtn').onclick=()=>{const v=parseInt(wrap.querySelector('#priceInput').value);if(v>=0){settings.price=v;persistAll();alert('ذخیره شد.')}};return wrap}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script></body></html>
